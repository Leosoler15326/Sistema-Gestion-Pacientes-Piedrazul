# Spring Framework 6.2+ / Spring Boot 4: habilita @MockitoBean en pruebas en capas.
spring.test.bean.override=true

# Base en memoria para @SpringBootTest sin PostgreSQL local.
spring.datasource.url=jdbc:h2:mem:sgp_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# JWT para tests de integración (clave de al menos 32 caracteres para HMAC-SHA256)
jwt.secret=PiedrazulTestSecretKeyIntegracion2026ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=86400000
