spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sgp_piedrazul}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080