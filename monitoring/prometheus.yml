global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend Spring Boot — métricas expuestas en /actuator/prometheus
  - job_name: 'sgp-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'SGP Piedrazul'
          environment: 'development'
