version: "3.8"

services:
  db:
    image: postgres:16
    container_name: sgp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgp_piedrazul
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: