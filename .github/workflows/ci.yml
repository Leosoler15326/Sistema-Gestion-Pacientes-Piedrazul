name: CI Pipeline – SGP Piedrazul

on:
  push:
    branches: [main, tercer-corte-branch]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Backend – Compilación + Pruebas (H2)
  # ──────────────────────────────────────────────
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y ejecutar pruebas (unitarias + integración)
        working-directory: ./Backend
        # Las pruebas usan H2 en memoria (src/test/resources/application.properties).
        # No se necesita PostgreSQL ni variables externas para el entorno de CI.
        run: mvn clean verify --no-transfer-progress

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Backend/target/surefire-reports/

  # ──────────────────────────────────────────────
  # JOB 2: Frontend – Lint + Build de producción
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./Frontend
        run: npm ci

      - name: Lint
        working-directory: ./Frontend
        run: npm run lint

      - name: Build de producción
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_API_URL: https://sgp-backend.onrender.com

      - name: Publicar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/

  # ──────────────────────────────────────────────
  # JOB 3: Notificación de resultado (solo en main)
  # ──────────────────────────────────────────────
  notify:
    name: Resumen CI
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Resultado del pipeline
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ]; then
            echo "::error::El pipeline falló. Revisa los reportes de pruebas."
            exit 1
          fi
          echo "Pipeline exitoso."
